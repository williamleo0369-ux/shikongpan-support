name: 使用问题
description: 提交可复现的功能问题；不要附带私人资料或设备完整日志。
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: "此反馈对所有人公开。请勿提供出生资料、住址、账号密码、验证码或诊断日志；截图请先脱敏。"
  - type: input
    id: feature
    attributes:
      label: 功能名称
      placeholder: 例如：罗盘、紫微斗数、盘例导入
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 匿名复现步骤
      description: 使用示例数据说明操作、预期结果和实际结果。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本和系统版本
      placeholder: 例如：时空盘 1.0（5），iOS 26.7.1
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开内容检查
      options:
        - label: 我确认未包含私人资料、密码、验证码或完整设备日志。
          required: true
